<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>X评云</title>
  <defs>
    <!-- 主色取自登录页标题色 #1890ff -->
    <linearGradient id="xpyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dabff"/>
      <stop offset="1" stop-color="#1890ff"/>
    </linearGradient>
  </defs>

  <!-- 圆形底：设置页用 round 圆形裁切，圆底能保证两处显示一致 -->
  <circle cx="512" cy="512" r="512" fill="url(#xpyBg)"/>

  <!-- 云朵：呼应「云」，作为下半部的承托 -->
  <path d="M336 686c-51 0-92-41-92-92 0-47 35-85 80-91 12-64 68-113 135-113 52 0 98 30 120 73 11-5 24-8 37-8 45 0 82 34 88 78 42 5 74 40 74 82 0 46-37 83-83 83H336z"
        fill="#ffffff" opacity="0.18"/>

  <!-- 主体 X -->
  <path d="M330 250h104l78 132 78-132h104L586 454l112 186H592l-80-134-80 134H326l112-186z"
        fill="#ffffff"/>

  <!-- 评分星：点出「评」的含义 -->
  <path d="M742 236l21 43 47 7-34 33 8 47-42-22-42 22 8-47-34-33 47-7z"
        fill="#ffd666"/>

  <!-- 「评云」二字：只放两字，避免圆形裁切时四字横排被切两头 -->
  <text x="512" y="820" text-anchor="middle"
        font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Heiti SC','Noto Sans CJK SC',sans-serif"
        font-size="176" font-weight="700" fill="#ffffff" letter-spacing="10">评云</text>
</svg>
